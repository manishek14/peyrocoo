services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # هم‌گام با نگاشت پورت؛ متغیرهای محیطی بر .env اولویت دارند
      APP_URL: http://localhost:8080
    volumes:
      # فایل‌های آپلودی کاربران در volume ماندگار
      - uploads:/var/www/public_html/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: peyrocoo
      MYSQL_USER: peyrocoo
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
  uploads:
