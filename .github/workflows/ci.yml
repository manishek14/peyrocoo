name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    name: تست‌ها (PHP 8.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_sqlite, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite (Unit + Feature)
        run: vendor/bin/phpunit

  docker:
    name: Docker build + boot check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t peyrocoo:ci .

      - name: Boot container (SQLite) and smoke-check
        run: |
          docker run -d --name peyrocoo -p 8080:80 \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/peyrocoo.sqlite \
            peyrocoo:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/login || true)
            if [ "$code" = "200" ]; then
              echo "container serves /login (attempt $i)"; exit 0
            fi
            sleep 2
          done
          echo "container did not serve /login in time"; exit 1
